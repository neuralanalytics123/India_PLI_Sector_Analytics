[project]
name = "omniretail-enterprise-analytics"
version = "0.1.0"
description = "PLI Capital & Value-Chain Radar India (2022-2026) ETL and Analytics Pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
